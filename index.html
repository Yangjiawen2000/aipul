<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Pulse 2025 | 前沿视界</title>
    <meta name="description" content="每日 AI 界的最新进展与深度解析">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <nav class="glass-nav">
        <div class="nav-content">
            <div class="logo">
                <span class="logo-text">AI 脉动</span>
                <span class="logo-year">2025</span>
            </div>
            <div class="nav-actions">
                <div id="connectivity-status" class="connectivity-status checking">探测中...</div>
                <div class="nav-divider">|</div>
                <div class="live-status">
                    <span class="status-dot"></span>
                    <span class="status-text">AI 分析师: 在线</span>
                </div>
                <div class="nav-divider">|</div>
                <div class="nav-date" id="current-date">2026.03.14</div>
                <button id="refresh-data" class="icon-btn" title="刷新 AI 分析">🔄</button>
            </div>
        </div>
    </nav>


    <main class="container">
        <header class="hero-section" id="hero-section">
            <div class="glass-card hero-card">
                <div class="tag">今日焦点</div>
                <h1 id="hero-title">加载中...</h1>
                <p id="hero-summary" class="hero-desc">正在通过 AI 引擎汇总今日最前沿的技术突破与行业动态。</p>
                <div class="hero-footer">
                    <span class="read-time">阅读时间: 3 min</span>
                    <button id="hero-link" class="btn-primary">深入了解</button>
                </div>
            </div>
        </header>

        <section class="filter-section">
            <div class="filter-bar" id="category-filters">
                <button class="filter-btn active" data-category="all">全部动态</button>
                <div class="filter-divider"></div>
                <button class="filter-btn" data-category="大语言模型">大模型</button>
                <button class="filter-btn" data-category="机器人学">机器人</button>
                <button class="filter-btn" data-category="芯片/算力">算力芯片</button>
                <button class="filter-btn" data-category="多模态">多模态</button>
                <button class="filter-btn" data-category="智能驾驶">智驾</button>
                <button class="filter-btn" data-category="AI 安全">安全治理</button>
            </div>
        </section>

        <section class="trends-grid" id="trends-grid">
            <!-- Cards will be injected by JS -->
        </section>

    </main>

    <footer class="footer">
        <p>&copy; 2025 AI Pulse Assistant. Created for Frontier Insights.</p>
    </footer>

    <!-- Detail Preview Modal -->
    <div id="detail-modal" class="modal-overlay">
        <div class="glass-card modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            <div class="modal-header">
                <span id="modal-category" class="category"></span>
                <span id="modal-impact" class="impact-tag"></span>
            </div>
            <h2 id="modal-title"></h2>
            <div id="modal-body" class="modal-body-text"></div>
            <div class="modal-footer">
                <div class="priority-box">
                    <span class="label">热度指数</span>
                    <span id="modal-priority" class="value"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- AI Smart Chat -->
    <div id="chat-widget" class="chat-widget">
        <div id="chat-window" class="chat-window">
            <div class="chat-header">
                <h3>AI 智能助手</h3>
                <button id="close-chat" class="close-btn-small">&times;</button>
            </div>
            <div id="chat-messages" class="chat-messages">
                <div class="message system">你好！我是 AI 脉动助手，有什么可以帮你的吗？</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="输入问题...">
                <button id="send-chat" class="btn-send">发送</button>
            </div>
        </div>
        <button id="chat-toggle" class="chat-toggle-btn">
            <span class="chat-icon">💬</span>
            <span class="chat-text">问问 AI</span>
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
